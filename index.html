function pct(v){v=Number(v)||0;return `${v>0?'+':''}${v.toFixed(1)}%`}

<div class="card" style="margin-top:14px"><h3>How these metrics are calculated</h3>
<div class="callout"><b>GP Rate</b> = total GP ÷ total taxable sales. &nbsp; <b>Discount Rate</b> = total discount ÷ total MRP. &nbsp; <b>Core Device ASP</b> = total core-device revenue ÷ total core-device units. &nbsp; <b>Accessory Attach</b> = device invoices with the accessory type ÷ total device invoices. &nbsp; <b>Multi-LOB Rate</b> = invoices carrying more than one core device LOB ÷ core-device invoices.</div></div>
</section>`}function method(){return `<section class="section active"><div class="grid2"><div class="card methodbox"><h3>Comparison logic</h3><b>Actual comparable period:</b> 27 Sep–4 Oct 2026 versus 28 Sep–5 Oct 2025 — 8 aligned OND calendar days.<br><b>Retail scope:</b> Warehouse, SMB and Hyd-HO non-retail activity are excluded from every displayed retail calculation and view.<br><b>OND’26 retail base:</b> available retail seasonal source base through 27 Dec 2025.<br><b>Primary OND’27 exit:</b> retail OND’26 seasonal base × current retail 8-day LFL YoY factor.<br><b>Secondary exit:</b> OND’27 actual / 8 elapsed days × 91 calendar days.<br><br>The prior source has no rows for 29 Sep 2025, so that aligned calendar day is retained as zero activity. Aptronix Felix Plaza is outside the approved 76-store scope. Twenty-eight prior-base Khammam accessory rows with UPC-sized values in both MRP and discount are quarantined from those two quality fields; signed revenue remains intact. Sale returns remain included with signed values.</div><div class="card methodbox"><h3>Metric logic</h3><b>LFL Revenue:</b> actual ₹ revenue for the 8 aligned calendar-day positions<br><b>OND Exit Revenue:</b> projected quarter exit, not actual revenue<br><b>Core LOB Growth Drivers:</b> unit movement for Mac, iPad, iPhone, Watch, AirPods<br><b>Accessory Growth Drivers:</b> ₹Cr value movement for Apple Accessories and 3P Accessories<br><b>Projected LOB Units:</b> LY available seasonal units × current LFL unit growth factor<br><b>GP%:</b> Σ GP AT Amount / Σ Taxable Amount<br><b>Discount%:</b> Σ valid MRP Discount / Σ valid MRP<br><b>AirPods:iPhone:</b> AirPods units / iPhone units<br><b>Mac:iPad:</b> Mac units / iPad units</div></div><div class="foot">Source: ${D.meta.source}. Retail business intelligence.</div></section>`}
function showTip(e,t){let el=document.getElementById('chartTip');if(!el)return;el.textContent=t;el.style.display='block';el.style.left=(e.clientX+12)+'px';el.style.top=(e.clientY+12)+'px'}
function hideTip(){let el=document.getElementById('chartTip');if(el)el.style.display='none'}
function dailyChart(){let el=document.getElementById('dailyChart');if(!el)return;let w=el.clientWidth||700,h=300,p=38,arr=D.daily,max=Math.max(...arr.flatMap(x=>[x.rev25,x.rev26]),1),X=i=>p+i*(w-2*p)/(Math.max(arr.length-1,1)),Y=v=>h-p-v/max*(h-2*p),pts=key=>arr.map((x,i)=>`${X(i)},${Y(x[key])}`).join(' '),lab=v=>`₹${(v/1e7).toFixed(2)} Cr`;let strategic=key=>{let vals=arr.map(x=>x[key]),hi=vals.indexOf(Math.max(...vals)),lo=vals.indexOf(Math.min(...vals));return [...new Set([0,hi,lo,arr.length-1])]},marks=(key,fill,dy)=>strategic(key).map(i=>`<g><circle cx="${X(i)}" cy="${Y(arr[i][key])}" r="4" fill="${fill}"/><text x="${X(i)}" y="${Y(arr[i][key])+dy}" font-size="9.5" font-weight="700" text-anchor="middle" fill="${fill}">${lab(arr[i][key])}</text></g>`).join(''),hover=key=>arr.map((x,i)=>{let title=`${x.date||''} • ${key==='rev25'?'OND’26':'OND’27'} • ${lab(x[key])}`.replace(/'/g,"\'");return `<circle cx="${X(i)}" cy="${Y(x[key])}" r="10" fill="rgba(0,0,0,0.001)" style="cursor:pointer" onmousemove="showTip(event,'${title}')" onmouseleave="hideTip()"/>`}).join('');el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#d8d3ca"/><polyline fill="none" stroke="#9b9387" stroke-width="2" points="${pts('rev25')}"/><polyline fill="none" stroke="#2d2b28" stroke-width="3" points="${pts('rev26')}"/>${marks('rev25','#8a8277',-9)}${marks('rev26','#2d2b28',14)}${hover('rev25')}${hover('rev26')}<text x="${p}" y="15" font-size="11" fill="#777">OND’26 comparable</text><text x="${p+135}" y="15" font-size="11" fill="#222">OND’27 actual</text></svg>`}
function render(){let f={exec,growth,lob,store,quality,method}[current];document.getElementById('app').innerHTML=f();setTimeout(dailyChart,0)}nav();render();
</script><script src="./ui-refresh.js"></script><script src="./governance.js?v=20261003-1"></script></body></html>
