function cr(v){v=Number(v)||0;return `₹${(v/1e7).toFixed(1)} Cr`}
function lakh(v){v=Number(v)||0;let sign=v>0?'+':'';return `${sign}₹${(v/1e7).toFixed(2)} Cr`}
function pct(v){v=Number(v)||0;return `${v>0?'+':''}${v.toFixed(1)}%`}
function n(v){v=Number(v)||0;return Math.round(v).toLocaleString('en-IN')}
function cls(v){v=Number(v)||0;return v>0?'pos':(v<0?'neg':'amber')}
const tabs=[['exec','Executive Exit'],['growth','Growth Drivers'],['lob','LOB Intelligence'],['store','Store & City Intelligence'],['quality','Quality of Sale'],['method','Methodology']];

function nav(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab ${current==t[0]?'active':''}" onclick="show('${t[0]}')">${t[1]}</button>`).join('')}
function show(id){current=id;nav();render()}
function kpi(label,value,sub=''){return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function bars(items,label='name',val='delta_rev',limit=10){let arr=items.slice(0,limit),mx=Math.max(...arr.map(x=>Math.abs(x[val])),1);return `<div class="bars">${arr.map(x=>`<div class="bargrp"><div class="bar ${x[val]>=0?'cy':''}" style="height:${Math.max(3,Math.abs(x[val])/mx*100)}%" title="${x[label]}: ${lakh(x[val])}"><span class="barval">${lakh(x[val])}</span></div><label>${x[label]}</label></div>`).join('')}</div>`}
function ranking(items,positive=true){return items.map((x,i)=>`<div class="rank"><span class="n">${i+1}</span><span class="name">${x.name}</span><span class="v ${cls(x.delta_rev)}">${lakh(x.delta_rev)} • ${pct(x.growth_pct)}</span></div>`).join('')}
function tableRows(items){return items.map(x=>`<tr><td>${x.name}</td><td class="num">${cr(x.ly_lfl.rev)}</td><td class="num">${cr(x.cy_lfl.rev)}</td><td class="num ${cls(x.growth_pct)}">${pct(x.growth_pct)}</td><td class="num">${cr(x.exit_rev)}</td><td class="num">${n(x.cy_lfl.units)}</td><td class="num">${x.cy_lfl.gp_pct.toFixed(1)}%</td><td class="num">${x.cy_lfl.disc_pct.toFixed(1)}%</td></tr>`).join('')}
function exec(){let o=D.overall,g=o.stores_growing,t=o.retail_stores;let insights=[
['Retail LFL performance',`${cr(o.cy_lfl.rev)} revenue for 1 Jul–30 Aug versus ${cr(o.ly_lfl.rev)} LY, a ${pct(o.growth_pct)} retail YoY movement.`],
['Growth breadth',`${g} of ${t} retail stores are growing YoY; ${o.stores_declining} remain below LY and form the intervention pool.`],
['LOB direction',`iPhone revenue YoY is ${pct(D.categories.find(x=>x.name==='iPhone').growth_pct)} while Mac is ${pct(D.categories.find(x=>x.name==='Mac').growth_pct)}. Device-unit movement is shown separately in Growth Drivers.`],
['Commercial quality',`Retail GP rate is ${o.cy_lfl.gp_pct.toFixed(1)}% versus ${o.ly_lfl.gp_pct.toFixed(1)}% LY; weighted discount is ${o.cy_lfl.disc_pct.toFixed(1)}% versus ${o.ly_lfl.disc_pct.toFixed(1)}%.`]
];return `<section class="section active"><div class="hero"><div><div class="method">RETAIL YOY EXIT • LFL ACTUAL + SEASONAL EXIT</div><h2>${pct(o.growth_pct)} retail LFL → ${cr(o.exit_rev)} projected JAS’26 exit</h2><p><b>LFL Revenue</b> is actual retail revenue for 1 Jul–30 Aug versus the exact same dates LY. <b>JAS Exit Revenue</b> is the seasonality-adjusted projected quarter exit using that retail YoY factor. Warehouse and SMB activity are excluded.</p></div></div></div>
<div class="kpis">${kpi('JAS’25 Retail Base',cr(o.ly_full.rev),'Retail sales base used for exit')}${kpi('JAS’26 Projected Exit',cr(o.exit_rev),`${pct(o.growth_pct)} retail LFL growth`)}${kpi('LFL Revenue — Actual',cr(o.cy_lfl.rev),`1 Jul–30 Aug • LY ${cr(o.ly_lfl.rev)}`)}${kpi('Stores Growing YoY',`${g} of ${t}`,`${((g/t)*100).toFixed(0)}% of stores are growing • ${o.stores_declining} below LY`)}</div>
<div class="kpis">${['Mac','iPad','iPhone','Watch','AirPods'].map(name=>{let x=D.categories.find(z=>z.name===name);return kpi(`${name} JAS Exit Units`,n(x.exit_units),`Actual till 30 Aug: ${n(x.cy_lfl.units)} • LY seasonality applied • ${pct(x.unit_growth_pct)} YoY`) }).join('')}</div>
<div class="insights">${insights.map(x=>`<div class="insight"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
<div class="grid2" style="margin-top:14px"><div class="card"><h3>Top retail growth contributors</h3>${ranking(D.storeTop.slice(0,7))}</div><div class="card"><h3>Largest retail drags</h3>${ranking(D.storeBottom.slice(0,7),false)}</div></div>
<div class="card" style="margin-top:14px"><h3>Priority intervention / recovery queue</h3><div class="tablewrap"><table><thead><tr><th>Store</th><th>Current YoY</th><th>LFL Gap</th><th>Projected Exit Recovery</th><th>Benchmark</th></tr></thead><tbody>${D.opportunities.slice(0,10).map(x=>`<tr><td>${x.name}</td><td class="num ${cls(x.growth_pct)}">${pct(x.growth_pct)}</td><td class="num">${cr(x.lfl_gap)}</td><td class="num pos">${cr(x.exit_upside)}</td><td class="num">${pct(x.target_growth)}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function unitBars(items){let mx=Math.max(...items.map(x=>Math.abs(x.delta_units)),1);return `<div class="bars">${items.map(x=>`<div class="bargrp"><div class="bar ${x.delta_units>=0?'cy':''}" style="height:${Math.max(3,Math.abs(x.delta_units)/mx*100)}%" title="${x.name}: ${x.delta_units>=0?'+':''}${n(x.delta_units)} units"><span class="barval">${x.delta_units>=0?'+':''}${n(x.delta_units)}</span></div><label>${x.name}</label></div>`).join('')}</div>`}
function valueBars(items){let mx=Math.max(...items.map(x=>Math.abs(x.delta_rev)),1);return `<div class="bars">${items.map(x=>`<div class="bargrp"><div class="bar ${x.delta_rev>=0?'cy':''}" style="height:${Math.max(3,Math.abs(x.delta_rev)/mx*100)}%" title="${x.name}: ${cr(x.delta_rev)}"><span class="barval">${cr(x.delta_rev)}</span></div><label>${x.name}</label></div>`).join('')}</div>`}
function decompTree(){let core=['Mac','iPad','iPhone','Watch','AirPods'].map(nm=>D.categories.find(x=>x.name===nm)),acc=['Apple Accessories','3P Accessories'].map(nm=>D.categories.find(x=>x.name===nm));return `<div class="decomp"><div class="decomp-level"><div class="decomp-node root"><b>Retail Growth Driver Decomposition</b><span>${pct(D.overall.growth_pct)} revenue YoY</span></div></div><div class="decomp-connector">↓</div><div class="splitbars"><div><div class="tree-note">Core LOB movement — units</div><div class="decomp-level">${core.map(x=>`<div class="decomp-node"><b>${x.name}</b><span class="${cls(x.delta_units)}">${x.delta_units>=0?'+':''}${n(x.delta_units)} units</span></div>`).join('')}</div></div><div><div class="tree-note">Accessory movement — value</div><div class="decomp-level">${acc.map(x=>`<div class="decomp-node"><b>${x.name}</b><span class="${cls(x.delta_rev)}">${cr(x.delta_rev)}</span></div>`).join('')}</div></div></div></div>`}
function growth(){let core=['Mac','iPad','iPhone','Watch','AirPods'].map(nm=>D.categories.find(x=>x.name===nm)),acc=['Apple Accessories','3P Accessories'].map(nm=>D.categories.find(x=>x.name===nm));return `<section class="section active"><div class="card"><h3>Growth drivers — core units + accessory value</h3><div class="splitbars"><div><div class="minihead">Core LOB YoY unit movement</div>${unitBars(core)}</div><div><div class="minihead">Accessory YoY value movement</div>${valueBars(acc)}</div></div><div class="metric-note">Core LOBs are intentionally measured in units; Apple Accessories and 3P Accessories are measured in ₹Cr value.</div></div><div class="card" style="margin-top:14px"><h3>Growth decomposition tree</h3>${decompTree()}</div><div class="card" style="margin-top:14px"><h3>Daily comparable retail revenue — 1 Jul to 30 Aug</h3><div class="chart" id="dailyChart"></div><div id="chartTip" class="charttip"></div><div class="legend"><span>Hover any point for date and exact revenue. Warehouse/SMB activity is excluded.</span></div></div></section>`}
function lob(){let core=['Mac','iPad','iPhone','Watch','AirPods'].map(nm=>D.categories.find(x=>x.name===nm));return `<section class="section active"><div class="kpis">${core.map(x=>kpi(x.name,`${pct(x.unit_growth_pct)} Unit YoY`,`${n(x.cy_lfl.units)} LFL units • ${n(x.exit_units)} projected exit units`)).join('')}</div><div class="card"><h3>LOB Intelligence — units first, revenue explicitly labelled</h3><div class="tablewrap"><table><thead><tr><th>LOB</th><th>LY LFL Units</th><th>CY LFL Units</th><th>Unit YoY</th><th>Projected Exit Units</th><th>LY Revenue</th><th>CY Revenue</th><th>Revenue YoY</th><th>GP%</th><th>Discount%</th></tr></thead><tbody>${core.map(x=>`<tr><td>${x.name}</td><td>${n(x.ly_lfl.units)}</td><td>${n(x.cy_lfl.units)}</td><td class="${cls(x.unit_growth_pct)}">${pct(x.unit_growth_pct)}</td><td>${n(x.exit_units)}</td><td>${cr(x.ly_lfl.rev)}</td><td>${cr(x.cy_lfl.rev)}</td><td class="${cls(x.growth_pct)}">${pct(x.growth_pct)}</td><td>${x.cy_lfl.gp_pct.toFixed(1)}%</td><td>${x.cy_lfl.disc_pct.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div><div class="metric-note">Example: “iPhone Revenue YoY +X%” is the change in ₹ revenue for the 61-day comparable period; “CY Revenue” is actual LFL revenue, while projected exit units are seasonality-adjusted unit exit—not the same metric.</div></div><div class="grid2" style="margin-top:14px"><div class="card"><h3>Cross-LOB relationships</h3><div class="callout">Mac:iPad unit ratio: <b>${D.overall.mac_ipad25.toFixed(2)}:1 → ${D.overall.mac_ipad26.toFixed(2)}:1</b></div><div class="callout" style="margin-top:8px">AirPods:iPhone unit ratio: <b>${D.overall.airpods_iphone_unit25.toFixed(1)}% → ${D.overall.airpods_iphone_unit26.toFixed(1)}%</b></div></div><div class="card"><h3>Quality overlay</h3><div class="callout">GP: <b>${D.overall.ly_lfl.gp_pct.toFixed(1)}% → ${D.overall.cy_lfl.gp_pct.toFixed(1)}%</b><br>Discount: <b>${D.overall.ly_lfl.disc_pct.toFixed(1)}% → ${D.overall.cy_lfl.disc_pct.toFixed(1)}%</b></div></div></div></section>`}

function unitStoreRows(arr){
 return arr.map(x=>{let ly=Number(x.units25||0),cy=Number(x.units26||0),g=x.unit_growth_pct,ex=Number(x.exit_units||0);return `<tr><td>${x.store}</td><td class="num">${n(ly)}</td><td class="num">${n(cy)}</td><td class="num ${g==null?'':cls(g)}">${g==null?'New':pct(g)}</td><td class="num">${n(ex)}</td><td class="num">${(cy/44).toFixed(1)}/day</td></tr>`}).join('')
}
function filterStore(){
 let q=(document.getElementById('storeSearch')?.value||'').toLowerCase(),lob=document.getElementById('storeLob')?.value||'All';
 let head=document.getElementById('storeHead'), rows=document.getElementById('storeRows'), title=document.getElementById('storeTitle'), note=document.getElementById('storeMetricNote');
 if(lob==='All'){
   let arr=D.stores.filter(x=>x.name.toLowerCase().includes(q)).sort((a,b)=>b.cy_lfl.rev-a.cy_lfl.rev);
   head.innerHTML='<tr><th>Store</th><th>LY LFL</th><th>CY LFL</th><th>YoY</th><th>Projected Exit</th><th>CY Units</th><th>GP%</th><th>Discount%</th></tr>';
   rows.innerHTML=tableRows(arr); title.textContent='Retail Store YOY Intelligence — Revenue';
   note.textContent='All LOBs uses ₹Cr revenue. Select a core LOB to switch the table to units.';
 } else {
