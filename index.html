function cr(v){v=Number(v)||0;return `₹${(v/1e7).toFixed(1)} Cr`}
function lakh(v){v=Number(v)||0;let sign=v>0?'+':'';return `${sign}₹${(v/1e7).toFixed(2)} Cr`}
function pct(v){v=Number(v)||0;return `${v>0?'+':''}${v.toFixed(1)}%`}
function n(v){v=Number(v)||0;return Math.round(v).toLocaleString('en-IN')}
function cls(v){v=Number(v)||0;return v>0?'pos':(v<0?'neg':'amber')}

function kpi(label,value,sub=''){return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function bars(items,label='name',val='delta_rev',limit=10){let arr=items.slice(0,limit),mx=Math.max(...arr.map(x=>Math.abs(x[val])),1);return `<div class="bars">${arr.map(x=>`<div class="bargrp"><div class="bar ${x[val]>=0?'cy':''}" style="height:${Math.max(3,Math.abs(x[val])/mx*100)}%" title="${x[label]}: ${lakh(x[val])}"><span class="barval">${lakh(x[val])}</span></div><label>${x[label]}</label></div>`).join('')}</div>`}
function ranking(items,positive=true){return items.map((x,i)=>`<div class="rank"><span class="n">${i+1}</span><span class="name">${x.name}</span><span class="v ${cls(x.delta_rev)}">${lakh(x.delta_rev)} • ${pct(x.growth_pct)}</span></div>`).join('')}

function growth(){let core=['Mac','iPad','iPhone','Watch','AirPods'].map(nm=>D.categories.find(x=>x.name===nm)),acc=['Apple Accessories','3P Accessories'].map(nm=>D.categories.find(x=>x.name===nm));return `<section class="section active"><div class="card"><h3>Growth drivers — core units + accessory value</h3><div class="splitbars"><div><div class="minihead">Core LOB YoY unit movement</div>${unitBars(core)}</div><div><div class="minihead">Accessory YoY value movement</div>${valueBars(acc)}</div></div><div class="metric-note">Core LOBs are intentionally measured in units; Apple Accessories and 3P Accessories are measured in ₹Cr value.</div></div><div class="card" style="margin-top:14px"><h3>Growth decomposition tree</h3>${decompTree()}</div><div class="card" style="margin-top:14px"><h3>Daily comparable retail revenue — 1 Jul to 25 Aug</h3><div class="chart" id="dailyChart"></div><div id="chartTip" class="charttip"></div><div class="legend"><span>Hover any point for date and exact revenue. Warehouse/SMB activity is excluded.</span></div></div></section>`}

<div class="card" style="margin-top:14px"><h3>How these metrics are calculated</h3>
<div class="callout"><b>GP Rate</b> = total GP ÷ total taxable sales. &nbsp; <b>Discount Rate</b> = total discount ÷ total MRP. &nbsp; <b>Core Device ASP</b> = total core-device revenue ÷ total core-device units. &nbsp; <b>Accessory Attach</b> = device invoices with the accessory type ÷ total device invoices. &nbsp; <b>Multi-LOB Rate</b> = invoices carrying more than one core device LOB ÷ core-device invoices.</div></div>
</section>`}function method(){return `<section class="section active"><div class="grid2"><div class="card methodbox"><h3>Comparison logic</h3><b>Actual comparable period:</b> 1 Jul–25 Aug 2026 versus 1 Jul–25 Aug 2025 — 44 calendar dates in each period.<br><b>Retail scope:</b> Warehouse, SMB and Hyd-HO non-retail activity are excluded from every displayed retail calculation and view.<br><b>JAS’25 retail base:</b> available retail seasonal source base through 27 Sep 2025.<br><b>Primary JAS’26 exit:</b> retail JAS’25 seasonal base × current retail 56-day LFL YoY factor.<br><b>Secondary exit:</b> retail 2026 actual / 56 elapsed days × 92 calendar days.<br><br>June rows are excluded. Sale returns remain included with signed values so revenue and units reflect net retail business.</div><div class="card methodbox"><h3>Metric logic</h3><b>LFL Revenue:</b> actual ₹ revenue for the exact comparable 56 dates<br><b>JAS Exit Revenue:</b> projected quarter exit, not actual revenue<br><b>Core LOB Growth Drivers:</b> unit movement for Mac, iPad, iPhone, Watch, AirPods<br><b>Accessory Growth Drivers:</b> ₹Cr value movement for Apple Accessories and 3P Accessories<br><b>Projected LOB Units:</b> LY available seasonal units × current LFL unit growth factor<br><b>GP%:</b> Σ GP AT Amount / Σ Taxable Amount<br><b>Discount%:</b> Σ MRP Discount / Σ MRP<br><b>AirPods:iPhone:</b> AirPods units / iPhone units<br><b>Mac:iPad:</b> Mac units / iPad units</div></div><div class="foot">Source: ${D.meta.source}. Retail business intelligence.</div></section>`}
