function cr(v){v=Number(v)||0;return `₹${(v/1e7).toFixed(1)} Cr`}
function lakh(v){v=Number(v)||0;let sign=v>0?'+':'';return `${sign}₹${(v/1e7).toFixed(2)} Cr`}
function pct(v){v=Number(v)||0;return `${v>0?'+':''}${v.toFixed(1)}%`}
function n(v){v=Number(v)||0;return Math.round(v).toLocaleString('en-IN')}
function cls(v){v=Number(v)||0;return v>0?'pos':(v<0?'neg':'amber')}

function show(id){current=id;nav();render()}
function kpi(label,value,sub=''){return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function bars(items,label='name',val='delta_rev',limit=10){let arr=items.slice(0,limit),mx=Math.max(...arr.map(x=>Math.abs(x[val])),1);return `<div class="bars">${arr.map(x=>`<div class="bargrp"><div class="bar ${x[val]>=0?'cy':''}" style="height:${Math.max(3,Math.abs(x[val])/mx*100)}%" title="${x[label]}: ${lakh(x[val])}"><span class="barval">${lakh(x[val])}</span></div><label>${x[label]}</label></div>`).join('')}</div>`}
function ranking(items,positive=true){return items.map((x,i)=>`<div class="rank"><span class="n">${i+1}</span><span class="name">${x.name}</span><span class="v ${cls(x.delta_rev)}">${lakh(x.delta_rev)} • ${pct(x.growth_pct)}</span></div>`).join('')}
function tableRows(items){return items.map(x=>`<tr><td>${x.name}</td><td class="num">${cr(x.ly_lfl.rev)}</td><td class="num">${cr(x.cy_lfl.rev)}</td><td class="num ${cls(x.growth_pct)}">${pct(x.growth_pct)}</td><td class="num">${cr(x.exit_rev)}</td><td class="num">${n(x.cy_lfl.units)}</td><td class="num">${x.cy_lfl.gp_pct.toFixed(1)}%</td><td class="num">${x.cy_lfl.disc_pct.toFixed(1)}%</td></tr>`).join('')}

];return `<section class="section active"><div class="hero"><div><div class="method">RETAIL YOY EXIT • LFL ACTUAL + SEASONAL EXIT</div><h2>${pct(o.growth_pct)} retail LFL → ${cr(o.exit_rev)} projected JAS’26 exit</h2><p><b>LFL Revenue</b> is actual retail revenue for 1 Jul–13 Aug versus the exact same dates LY. <b>JAS Exit Revenue</b> is the seasonality-adjusted projected quarter exit using that retail YoY factor. Warehouse and SMB activity are excluded.</p></div></div></div>
<div class="kpis">${kpi('JAS’25 Retail Base',cr(o.ly_full.rev),'Retail sales base used for exit')}${kpi('JAS’26 Projected Exit',cr(o.exit_rev),`${pct(o.growth_pct)} retail LFL growth`)}${kpi('LFL Revenue — Actual',cr(o.cy_lfl.rev),`1 Jul–13 Aug • LY ${cr(o.ly_lfl.rev)}`)}${kpi('Stores Growing YoY',`${g} of ${t}`,`${((g/t)*100).toFixed(0)}% of stores are growing • ${o.stores_declining} below LY`)}</div>

function unitBars(items){let mx=Math.max(...items.map(x=>Math.abs(x.delta_units)),1);return `<div class="bars">${items.map(x=>`<div class="bargrp"><div class="bar ${x.delta_units>=0?'cy':''}" style="height:${Math.max(3,Math.abs(x.delta_units)/mx*100)}%" title="${x.name}: ${x.delta_units>=0?'+':''}${n(x.delta_units)} units"><span class="barval">${x.delta_units>=0?'+':''}${n(x.delta_units)}</span></div><label>${x.name}</label></div>`).join('')}</div>`}

function decompTree(){let core=['Mac','iPad','iPhone','Watch','AirPods'].map(nm=>D.categories.find(x=>x.name===nm)),acc=['Apple Accessories','3P Accessories'].map(nm=>D.categories.find(x=>x.name===nm));return `<div class="decomp"><div class="decomp-level"><div class="decomp-node root"><b>Retail Growth Driver Decomposition</b><span>${pct(D.overall.growth_pct)} revenue YoY</span></div></div><div class="decomp-connector">↓</div><div class="splitbars"><div><div class="tree-note">Core LOB movement — units</div><div class="decomp-level">${core.map(x=>`<div class="decomp-node"><b>${x.name}</b><span class="${cls(x.delta_units)}">${x.delta_units>=0?'+':''}${n(x.delta_units)} units</span></div>`).join('')}</div></div><div><div class="tree-note">Accessory movement — value</div><div class="decomp-level">${acc.map(x=>`<div class="decomp-node"><b>${x.name}</b><span class="${cls(x.delta_rev)}">${cr(x.delta_rev)}</span></div>`).join('')}</div></div></div></div>`}
function growth(){let core=['Mac','iPad','iPhone','Watch','AirPods'].map(nm=>D.categories.find(x=>x.name===nm)),acc=['Apple Accessories','3P Accessories'].map(nm=>D.categories.find(x=>x.name===nm));return `<section class="section active"><div class="card"><h3>Growth drivers — core units + accessory value</h3><div class="splitbars"><div><div class="minihead">Core LOB YoY unit movement</div>${unitBars(core)}</div><div><div class="minihead">Accessory YoY value movement</div>${valueBars(acc)}</div></div><div class="metric-note">Core LOBs are intentionally measured in units; Apple Accessories and 3P Accessories are measured in ₹Cr value.</div></div><div class="card" style="margin-top:14px"><h3>Growth decomposition tree</h3>${decompTree()}</div><div class="card" style="margin-top:14px"><h3>Daily comparable retail revenue — 1 Jul to 13 Aug</h3><div class="chart" id="dailyChart"></div><div id="chartTip" class="charttip"></div><div class="legend"><span>Hover any point for date and exact revenue. Warehouse/SMB activity is excluded.</span></div></div></section>`}
function lob(){let core=['Mac','iPad','iPhone','Watch','AirPods'].map(nm=>D.categories.find(x=>x.name===nm));return `<section class="section active"><div class="kpis">${core.map(x=>kpi(x.name,`${pct(x.unit_growth_pct)} Unit YoY`,`${n(x.cy_lfl.units)} LFL units • ${n(x.exit_units)} projected exit units`)).join('')}</div><div class="card"><h3>LOB Intelligence — units first, revenue explicitly labelled</h3><div class="tablewrap"><table><thead><tr><th>LOB</th><th>LY LFL Units</th><th>CY LFL Units</th><th>Unit YoY</th><th>Projected Exit Units</th><th>LY Revenue</th><th>CY Revenue</th><th>Revenue YoY</th><th>GP%</th><th>Discount%</th></tr></thead><tbody>${core.map(x=>`<tr><td>${x.name}</td><td>${n(x.ly_lfl.units)}</td><td>${n(x.cy_lfl.units)}</td><td class="${cls(x.unit_growth_pct)}">${pct(x.unit_growth_pct)}</td><td>${n(x.exit_units)}</td><td>${cr(x.ly_lfl.rev)}</td><td>${cr(x.cy_lfl.rev)}</td><td class="${cls(x.growth_pct)}">${pct(x.growth_pct)}</td><td>${x.cy_lfl.gp_pct.toFixed(1)}%</td><td>${x.cy_lfl.disc_pct.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div><div class="metric-note">Example: “iPhone Revenue YoY +X%” is the change in ₹ revenue for the 44-day comparable period; “CY Revenue” is actual LFL revenue, while projected exit units are seasonality-adjusted unit exit—not the same metric.</div></div><div class="grid2" style="margin-top:14px"><div class="card"><h3>Cross-LOB relationships</h3><div class="callout">Mac:iPad unit ratio: <b>${D.overall.mac_ipad25.toFixed(2)}:1 → ${D.overall.mac_ipad26.toFixed(2)}:1</b></div><div class="callout" style="margin-top:8px">AirPods:iPhone unit ratio: <b>${D.overall.airpods_iphone_unit25.toFixed(1)}% → ${D.overall.airpods_iphone_unit26.toFixed(1)}%</b></div></div><div class="card"><h3>Quality overlay</h3><div class="callout">GP: <b>${D.overall.ly_lfl.gp_pct.toFixed(1)}% → ${D.overall.cy_lfl.gp_pct.toFixed(1)}%</b><br>Discount: <b>${D.overall.ly_lfl.disc_pct.toFixed(1)}% → ${D.overall.cy_lfl.disc_pct.toFixed(1)}%</b></div> function filterStore(){
 let q=(document.getElementById('storeSearch')?.value||'').toLowerCase(),lob=document.getElementById('storeLob')?.value||'All';
 let head=document.getElementById('storeHead'), rows=document.getElementById('storeRows'), title=document.getElementById('storeTitle'), note=document.getElementById('storeMetricNote');
 if(lob==='All'){
   let arr=D.stores.filter(x=>x.name.toLowerCase().includes(q)).sort((a,b)=>b.cy_lfl.rev-a.cy_lfl.rev);
   head.innerHTML='<tr><th>Store</th><th>LY LFL</th><th>CY LFL</th><th>YoY</th><th>Projected Exit</th><th>CY Units</th><th>GP%</th><th>Discount%</th></tr>';

 }

<div class="card" style="margin-top:14px"><h3>How these metrics are calculated</h3>
<div class="callout"><b>GP Rate</b> = total GP ÷ total taxable sales. &nbsp; <b>Discount Rate</b> = total discount ÷ total MRP. &nbsp; <b>Core Device ASP</b> = total core-device revenue ÷ total core-device units. &nbsp; <b>Accessory Attach</b> = device invoices with the accessory type ÷ total device invoices. &nbsp; <b>Multi-LOB Rate</b> = invoices carrying more than one core device LOB ÷ core-device invoices.</div></div>
</section>`}function method(){return `<section class="section active"><div class="grid2"><div class="card methodbox"><h3>Comparison logic</h3><b>Actual comparable period:</b> 1 Jul–13 Aug 2026 versus 1 Jul–13 Aug 2025 — 44 calendar dates in each period.<br><b>Retail scope:</b> Warehouse, SMB and Hyd-HO non-retail activity are excluded from every displayed retail calculation and view.<br><b>JAS’25 retail base:</b> available retail seasonal source base through 27 Sep 2025.<br><b>Primary JAS’26 exit:</b> retail JAS’25 seasonal base × current retail 44-day LFL YoY factor.<br><b>Secondary exit:</b> retail 2026 actual / 44 elapsed days × 92 calendar days.<br><br>June rows are excluded. Sale returns remain included with signed values so revenue and units reflect net retail business.</div><div class="card methodbox"><h3>Metric logic</h3><b>LFL Revenue:</b> actual ₹ revenue for the exact comparable 44 dates<br><b>JAS Exit Revenue:</b> projected quarter exit, not actual revenue<br><b>Core LOB Growth Drivers:</b> unit movement for Mac, iPad, iPhone, Watch, AirPods<br><b>Accessory Growth Drivers:</b> ₹Cr value movement for Apple Accessories and 3P Accessories<br><b>Projected LOB Units:</b> LY available seasonal units × current LFL unit growth factor<br><b>GP%:</b> Σ GP AT Amount / Σ Taxable Amount<br><b>Discount%:</b> Σ MRP Discount / Σ MRP<br><b>AirPods:iPhone:</b> AirPods units / iPhone units<br><b>Mac:iPad:</b> Mac units / iPad units</div></div><div class="foot">Source: ${D.meta.source}. Retail business intelligence.</div></section>`}

function dailyChart(){let el=document.getElementById('dailyChart');if(!el)return;let w=el.clientWidth||700,h=300,p=38,arr=D.daily,max=Math.max(...arr.flatMap(x=>[x.rev25,x.rev26]),1),X=i=>p+i*(w-2*p)/(Math.max(arr.length-1,1)),Y=v=>h-p-v/max*(h-2*p),pts=key=>arr.map((x,i)=>`${X(i)},${Y(x[key])}`).join(' '),lab=v=>`₹${(v/1e7).toFixed(2)} Cr`;let strategic=key=>{let vals=arr.map(x=>x[key]),hi=vals.indexOf(Math.max(...vals)),lo=vals.indexOf(Math.min(...vals));return [...new Set([0,hi,lo,arr.length-1])]},marks=(key,fill,dy)=>strategic(key).map(i=>`<g><circle cx="${X(i)}" cy="${Y(arr[i][key])}" r="4" fill="${fill}"/><text x="${X(i)}" y="${Y(arr[i][key])+dy}" font-size="9.5" font-weight="700" text-anchor="middle" fill="${fill}">${lab(arr[i][key])}</text></g>`).join(''),hover=key=>arr.map((x,i)=>{let title=`${x.date||''} • ${key==='rev25'?'JAS’25':'JAS’26'} • ${lab(x[key])}`.replace(/'/g,"\'");return `<circle cx="${X(i)}" cy="${Y(x[key])}" r="10" fill="rgba(0,0,0,0.001)" style="cursor:pointer" onmousemove="showTip(event,'${title}')" onmouseleave="hideTip()"/>`}).join('');el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#d8d3ca"/><polyline fill="none" stroke="#9b9387" stroke-width="2" points="${pts('rev25')}"/><polyline fill="none" stroke="#2d2b28" stroke-width="3" points="${pts('rev26')}"/>${marks('rev25','#8a8277',-9)}${marks('rev26','#2d2b28',14)}${hover('rev25')}${hover('rev26')}<text x="${p}" y="15" font-size="11" fill="#777">JAS’25 comparable</text><text x="${p+135}" y="15" font-size="11" fill="#222">JAS’26 actual</text></svg>`}
