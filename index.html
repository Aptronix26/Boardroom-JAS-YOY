function cr(v){v=Number(v)||0;return `₹${(v/1e7).toFixed(1)} Cr`}
function lakh(v){v=Number(v)||0;let sign=v>0?'+':'';return `${sign}₹${(v/1e7).toFixed(2)} Cr`}
function pct(v){v=Number(v)||0;return `${v>0?'+':''}${v.toFixed(1)}%`}
function yoy(cy,ly){cy=Number(cy)||0;ly=Number(ly)||0;return ly?(cy/ly-1)*100:0}
function n(v){v=Number(v)||0;return Math.round(v).toLocaleString('en-IN')}
function cls(v){v=Number(v)||0;return v>0?'pos':(v<0?'neg':'amber')}
const tabs=[['exec','Executive Exit'],['growth','Growth Drivers'],['lob','LOB Intelligence'],['store','Store & City Intelligence'],['quality','Quality of Sale'],['method','Methodology']];
let current='exec';
function nav(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab ${current==t[0]?'active':''}" onclick="show('${t[0]}')">${t[1]}</button>`).join('')}
function show(id){current=id;nav();render()}
function kpi(label,value,sub=''){return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function bars(items,label='name',val='delta_rev',limit=10){let arr=items.slice(0,limit),mx=Math.max(...arr.map(x=>Math.abs(x[val])),1);return `<div class="bars">${arr.map(x=>`<div class="bargrp"><div class="bar ${x[val]>=0?'cy':''}" style="height:${Math.max(3,Math.abs(x[val])/mx*100)}%" title="${x[label]}: ${lakh(x[val])}"><span class="barval">${lakh(x[val])}</span></div><label>${x[label]}</label></div>`).join('')}</div>`}
function ranking(items,positive=true){return items.map((x,i)=>`<div class="rank"><span class="n">${i+1}</span><span class="name">${x.name}</span><span class="v ${cls(x.delta_rev)}">${lakh(x.delta_rev)} • ${pct(x.growth_pct)}</span></div>`).join('')}
function tableRows(items){return items.map(x=>`<tr><td>${x.name}</td><td class="num">${cr(x.ly_lfl.rev)}</td><td class="num">${cr(x.cy_lfl.rev)}</td><td class="num ${cls(x.growth_pct)}">${pct(x.growth_pct)}</td><td class="num">${cr(x.exit_rev)}</td><td class="num">${n(x.cy_lfl.units)}</td><td class="num">${x.cy_lfl.gp_pct.toFixed(1)}%</td><td class="num">${x.cy_lfl.disc_pct.toFixed(1)}%</td></tr>`).join('')}
function exec(){let o=D.overall,g=o.stores_growing,t=o.retail_stores;let insights=[
['Retail LFL performance',`${cr(o.cy_lfl.rev)} revenue for 27 Sep–2 Oct versus ${cr(o.ly_lfl.rev)} LY, a ${pct(o.growth_pct)} retail YoY movement.`],
['Growth breadth',`${g} of ${t} retail stores are growing YoY; ${o.stores_declining} remain below LY and form the intervention pool.`],
['LOB direction',`iPhone revenue YoY is ${pct(D.categories.find(x=>x.name==='iPhone').growth_pct)} while Mac is ${pct(D.categories.find(x=>x.name==='Mac').growth_pct)}. Device-unit movement is shown separately in Growth Drivers.`],
['Commercial quality',`Retail GP rate is ${o.cy_lfl.gp_pct.toFixed(1)}% versus ${o.ly_lfl.gp_pct.toFixed(1)}% LY; weighted discount is ${o.cy_lfl.disc_pct.toFixed(1)}% versus ${o.ly_lfl.disc_pct.toFixed(1)}%.`]
];return `<section class="section active"><div class="hero"><div><div class="method">RETAIL YOY EXIT • LFL ACTUAL + SEASONAL EXIT</div><h2>${pct(o.growth_pct)} retail LFL → ${cr(o.exit_rev)} projected OND’27 exit</h2><p><b>LFL Revenue</b> compares the first six aligned OND calendar-day positions: 27 Sep–2 Oct 2026 versus 28 Sep–3 Oct 2025. <b>OND Exit Revenue</b> is the seasonality-adjusted projected quarter exit using that retail YoY factor. Warehouse and SMB activity are excluded.</p></div></div></div>
<div class="kpis">${kpi('OND’26 Retail Base',cr(o.ly_full.rev),'Retail sales base used for exit')}${kpi('OND’27 Projected Exit',cr(o.exit_rev),`${pct(o.growth_pct)} retail LFL growth`)}${kpi('LFL Revenue — Actual',cr(o.cy_lfl.rev),`27 Sep–2 Oct • LY ${cr(o.ly_lfl.rev)}`)}${kpi('Stores Growing YoY',`${g} of ${t}`,`${((g/t)*100).toFixed(0)}% of stores are growing • ${o.stores_declining} below LY`)}</div>
<div class="kpis">${['Mac','iPad','iPhone','Watch','AirPods'].map(name=>{let x=D.categories.find(z=>z.name===name);return kpi(`${name} OND Exit Units`,n(x.exit_units),`Actual till 2 Oct: ${n(x.cy_lfl.units)} • LY seasonality applied • ${pct(x.unit_growth_pct)} YoY`) }).join('')}</div>
<div class="insights">${insights.map(x=>`<div class="insight"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
<div class="grid2" style="margin-top:14px"><div class="card"><h3>Top retail growth contributors</h3>${ranking(D.storeTop.slice(0,7))}</div><div class="card"><h3>Largest retail drags</h3>${ranking(D.storeBottom.slice(0,7),false)}</div></div>
<div class="card" style="margin-top:14px"><h3>Priority intervention / recovery queue</h3><div class="tablewrap"><table><thead><tr><th>Store</th><th>Current YoY</th><th>LFL Gap</th><th>Projected Exit Recovery</th><th>Benchmark</th></tr></thead><tbody>${D.opportunities.slice(0,10).map(x=>`<tr><td>${x.name}</td><td class="num ${cls(x.growth_pct)}">${pct(x.growth_pct)}</td><td class="num">${cr(x.lfl_gap)}</td><td class="num pos">${cr(x.exit_upside)}</td><td class="num">${pct(x.target_growth)}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function unitBars(items){let mx=Math.max(...items.map(x=>Math.abs(x.delta_units)),1);return `<div class="bars">${items.map(x=>`<div class="bargrp"><div class="bar ${x.delta_units>=0?'cy':''}" style="height:${Math.max(3,Math.abs(x.delta_units)/mx*100)}%" title="${x.name}: ${x.delta_units>=0?'+':''}${n(x.delta_units)} units"><span class="barval">${x.delta_units>=0?'+':''}${n(x.delta_units)}</span></div><label>${x.name}</label></div>`).join('')}</div>`}
function valueBars(items){let mx=Math.max(...items.map(x=>Math.abs(x.delta_rev)),1);return `<div class="bars">${items.map(x=>`<div class="bargrp"><div class="bar ${x.delta_rev>=0?'cy':''}" style="height:${Math.max(3,Math.abs(x.delta_rev)/mx*100)}%" title="${x.name}: ${cr(x.delta_rev)}"><span class="barval">${cr(x.delta_rev)}</span></div><label>${x.name}</label></div>`).join('')}</div>`}
function decompTree(){let core=['Mac','iPad','iPhone','Watch','AirPods'].map(nm=>D.categories.find(x=>x.name===nm)),acc=['Apple Accessories','3P Accessories'].map(nm=>D.categories.find(x=>x.name===nm));return `<div class="decomp"><div class="decomp-level"><div class="decomp-node root"><b>Retail Growth Driver Decomposition</b><span>${pct(D.overall.growth_pct)} revenue YoY</span></div></div><div class="decomp-connector">↓</div><div class="splitbars"><div><div class="tree-note">Core LOB movement — units</div><div class="decomp-level">${core.map(x=>`<div class="decomp-node"><b>${x.name}</b><span class="${cls(x.delta_units)}">${x.delta_units>=0?'+':''}${n(x.delta_units)} units</span></div>`).join('')}</div></div><div><div class="tree-note">Accessory movement — value</div><div class="decomp-level">${acc.map(x=>`<div class="decomp-node"><b>${x.name}</b><span class="${cls(x.delta_rev)}">${cr(x.delta_rev)}</span></div>`).join('')}</div></div></div></div>`}
function growth(){let core=['Mac','iPad','iPhone','Watch','AirPods'].map(nm=>D.categories.find(x=>x.name===nm)),acc=['Apple Accessories','3P Accessories'].map(nm=>D.categories.find(x=>x.name===nm));return `<section class="section active"><div class="card"><h3>Growth drivers — core units + accessory value</h3><div class="splitbars"><div><div class="minihead">Core LOB YoY unit movement</div>${unitBars(core)}</div><div><div class="minihead">Accessory YoY value movement</div>${valueBars(acc)}</div></div><div class="metric-note">Core LOBs are intentionally measured in units; Apple Accessories and 3P Accessories are measured in ₹Cr value.</div></div><div class="card" style="margin-top:14px"><h3>Growth decomposition tree</h3>${decompTree()}</div><div class="card" style="margin-top:14px"><h3>Daily comparable retail revenue — 27 Sep to 2 Oct</h3><div class="chart" id="dailyChart"></div><div id="chartTip" class="charttip"></div><div class="legend"><span>Hover any point for date and exact revenue. Warehouse/SMB activity is excluded.</span></div></div></section>`}
function lob(){let core=['Mac','iPad','iPhone','Watch','AirPods'].map(nm=>D.categories.find(x=>x.name===nm));return `<section class="section active"><div class="kpis">${core.map(x=>kpi(x.name,`${pct(x.unit_growth_pct)} Unit YoY`,`${n(x.cy_lfl.units)} LFL units • ${n(x.exit_units)} projected exit units`)).join('')}</div><div class="card"><h3>LOB Intelligence — units first, revenue explicitly labelled</h3><div class="tablewrap"><table><thead><tr><th>LOB</th><th>LY LFL Units</th><th>CY LFL Units</th><th>Unit YoY</th><th>Projected Exit Units</th><th>LY Revenue</th><th>CY Revenue</th><th>Revenue YoY</th><th>GP%</th><th>Discount%</th></tr></thead><tbody>${core.map(x=>`<tr><td>${x.name}</td><td>${n(x.ly_lfl.units)}</td><td>${n(x.cy_lfl.units)}</td><td class="${cls(x.unit_growth_pct)}">${pct(x.unit_growth_pct)}</td><td>${n(x.exit_units)}</td><td>${cr(x.ly_lfl.rev)}</td><td>${cr(x.cy_lfl.rev)}</td><td class="${cls(x.growth_pct)}">${pct(x.growth_pct)}</td><td>${x.cy_lfl.gp_pct.toFixed(1)}%</td><td>${x.cy_lfl.disc_pct.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div><div class="metric-note">Example: “iPhone Revenue YoY +X%” is the change in ₹ revenue for the 6-day comparable period; “CY Revenue” is actual LFL revenue, while projected exit units are seasonality-adjusted unit exit—not the same metric.</div></div><div class="grid2" style="margin-top:14px"><div class="card"><h3>Cross-LOB relationships</h3><div class="callout">Mac:iPad unit ratio: <b>${D.overall.mac_ipad25.toFixed(2)}:1 → ${D.overall.mac_ipad26.toFixed(2)}:1</b></div><div class="callout" style="margin-top:8px">AirPods:iPhone unit ratio: <b>${D.overall.airpods_iphone_unit25.toFixed(1)}% → ${D.overall.airpods_iphone_unit26.toFixed(1)}%</b></div></div><div class="card"><h3>Quality overlay</h3><div class="callout">GP: <b>${D.overall.ly_lfl.gp_pct.toFixed(1)}% → ${D.overall.cy_lfl.gp_pct.toFixed(1)}%</b><br>Discount: <b>${D.overall.ly_lfl.disc_pct.toFixed(1)}% → ${D.overall.cy_lfl.disc_pct.toFixed(1)}%</b></div></div></div></section>`}
function store(){
return `<section class="section active">
<div class="filters"><input id="storeSearch" placeholder="Search retail store…" oninput="filterStore()">
<select id="storeLob" onchange="filterStore()"><option value="All">All LOBs — Revenue</option>${['Mac','iPad','iPhone','Watch','AirPods'].map(x=>`<option value="${x}">${x} — Units</option>`).join('')}</select></div>
<div class="card"><h3 id="storeTitle">Retail Store YOY Intelligence — Revenue</h3>
<div class="metric-note" id="storeMetricNote">All LOBs uses ₹Cr revenue. Select Mac, iPad, iPhone, Watch or AirPods to switch the table to unit productivity.</div>
<div class="tablewrap"><table><thead id="storeHead"><tr><th>Store</th><th>LY LFL</th><th>CY LFL</th><th>YoY</th><th>Projected Exit</th><th>CY Units</th><th>GP%</th><th>Discount%</th></tr></thead><tbody id="storeRows">${tableRows([...D.stores].sort((a,b)=>b.cy_lfl.rev-a.cy_lfl.rev))}</tbody></table></div></div>
<div class="grid2" style="margin-top:14px"><div class="card"><h3>Top contributors</h3>${ranking(D.storeTop)}</div><div class="card"><h3>Bottom contributors</h3>${ranking(D.storeBottom)}</div></div>
<div class="card" style="margin-top:14px"><h3>City / Market Intelligence</h3><div class="tablewrap"><table><thead><tr><th>City</th><th>LY LFL</th><th>CY LFL</th><th>YoY</th><th>Projected Exit</th><th>CY Units</th><th>GP%</th><th>Discount%</th></tr></thead><tbody>${tableRows([...D.cities].sort((a,b)=>b.cy_lfl.rev-a.cy_lfl.rev))}</tbody></table></div></div>
</section>`}
function unitStoreRows(arr){
 return arr.map(x=>{let ly=Number(x.units25||0),cy=Number(x.units26||0),g=x.unit_growth_pct,ex=Number(x.exit_units||0);return `<tr><td>${x.store}</td><td class="num">${n(ly)}</td><td class="num">${n(cy)}</td><td class="num ${g==null?'':cls(g)}">${g==null?'New':pct(g)}</td><td class="num">${n(ex)}</td><td class="num">${(cy/6).toFixed(1)}/day</td></tr>`}).join('')
}
function filterStore(){
 let q=(document.getElementById('storeSearch')?.value||'').toLowerCase(),lob=document.getElementById('storeLob')?.value||'All';
 let head=document.getElementById('storeHead'), rows=document.getElementById('storeRows'), title=document.getElementById('storeTitle'), note=document.getElementById('storeMetricNote');
 if(lob==='All'){
   let arr=D.stores.filter(x=>x.name.toLowerCase().includes(q)).sort((a,b)=>b.cy_lfl.rev-a.cy_lfl.rev);
   head.innerHTML='<tr><th>Store</th><th>LY LFL</th><th>CY LFL</th><th>YoY</th><th>Projected Exit</th><th>CY Units</th><th>GP%</th><th>Discount%</th></tr>';
   rows.innerHTML=tableRows(arr); title.textContent='Retail Store YOY Intelligence — Revenue';
   note.textContent='All LOBs uses ₹Cr revenue. Select a core LOB to switch the table to units.';
 } else {
   let arr=D.storeCategory.filter(x=>x.category===lob && x.store.toLowerCase().includes(q)).sort((a,b)=>Number(b.units26||0)-Number(a.units26||0));
   head.innerHTML='<tr><th>Store</th><th>LY LFL Units</th><th>CY LFL Units</th><th>Unit YoY</th><th>Projected Exit Units</th><th>Current Run Rate</th></tr>';
   rows.innerHTML=unitStoreRows(arr); title.textContent=lob+' Store Intelligence — Units';
   note.textContent=lob+' is a core LOB, so this view intentionally uses units rather than revenue. LY and CY are unit counts for the same comparable period. Projected exit is shown in units using the current 6-day unit run-rate.';
 }
}function quality(){let a=D.overall.attach25,b=D.overall.attach26,o=D.overall,combos=Object.entries(b.combo_counts||{});
let move=(cy,ly)=>`${cy-ly>=0?'+':''}${(cy-ly).toFixed(1)} pts`;
return `<section class="section active">
<div class="kpis">
${kpi('GP Rate',`${o.cy_lfl.gp_pct.toFixed(1)}%`,`${move(o.cy_lfl.gp_pct,o.ly_lfl.gp_pct)} vs LY`)}
${kpi('Discount Rate',`${o.cy_lfl.disc_pct.toFixed(1)}%`,`${move(o.cy_lfl.disc_pct,o.ly_lfl.disc_pct)} vs LY`)}
${kpi('Core Device ASP',`₹${(o.core_asp26/1000).toFixed(1)}K`,`₹${(o.core_asp25/1000).toFixed(1)}K LY • ${pct(yoy(o.core_asp26,o.core_asp25))} YoY`)}
${kpi('Apple Acc Attach',`${b.apple_acc_attach.toFixed(1)}%`,`${move(b.apple_acc_attach,a.apple_acc_attach)} vs LY`)}
${kpi('3P Acc Attach',`${b.tp_acc_attach.toFixed(1)}%`,`${move(b.tp_acc_attach,a.tp_acc_attach)} vs LY`)}
${kpi('Multi-LOB Bills',`${b.multi_lob_rate.toFixed(1)}%`,`${a.multi_lob_rate.toFixed(1)}% LY • ${move(b.multi_lob_rate,a.multi_lob_rate)}`)}
</div>

<div class="grid2">
<div class="card"><h3>Commercial quality movement</h3>
<div class="tablewrap"><table><thead><tr><th>Metric</th><th>LY</th><th>CY</th><th>Movement</th><th>Leadership meaning</th></tr></thead><tbody>
<tr><td>GP Rate</td><td>${o.ly_lfl.gp_pct.toFixed(1)}%</td><td>${o.cy_lfl.gp_pct.toFixed(1)}%</td><td class="${cls(o.cy_lfl.gp_pct-o.ly_lfl.gp_pct)}">${move(o.cy_lfl.gp_pct,o.ly_lfl.gp_pct)}</td><td>Margin quality on sales</td></tr>
<tr><td>Discount Rate</td><td>${o.ly_lfl.disc_pct.toFixed(1)}%</td><td>${o.cy_lfl.disc_pct.toFixed(1)}%</td><td class="${cls(o.ly_lfl.disc_pct-o.cy_lfl.disc_pct)}">${move(o.cy_lfl.disc_pct,o.ly_lfl.disc_pct)}</td><td>Lower discount is better</td></tr>
<tr><td>Core Device ASP</td><td>₹${(o.core_asp25/1000).toFixed(1)}K</td><td>₹${(o.core_asp26/1000).toFixed(1)}K</td><td class="${cls(yoy(o.core_asp26,o.core_asp25))}">${pct(yoy(o.core_asp26,o.core_asp25))}</td><td>Average selling price across Mac, iPad, iPhone, Watch and AirPods</td></tr>
<tr><td>Apple Acc Attach</td><td>${a.apple_acc_attach.toFixed(1)}%</td><td>${b.apple_acc_attach.toFixed(1)}%</td><td>${move(b.apple_acc_attach,a.apple_acc_attach)}</td><td>Device bills carrying Apple accessories</td></tr>
<tr><td>3P Acc Attach</td><td>${a.tp_acc_attach.toFixed(1)}%</td><td>${b.tp_acc_attach.toFixed(1)}%</td><td>${move(b.tp_acc_attach,a.tp_acc_attach)}</td><td>Device bills carrying 3P accessories</td></tr>
<tr><td>Multi-LOB Bills</td><td>${a.multi_lob_rate.toFixed(1)}%</td><td>${b.multi_lob_rate.toFixed(1)}%</td><td class="${cls(b.multi_lob_rate-a.multi_lob_rate)}">${move(b.multi_lob_rate,a.multi_lob_rate)}</td><td>Invoices carrying more than one core device LOB</td></tr>
</tbody></table></div></div>

<div class="card"><h3>Multi-LOB basket intelligence</h3>
<div class="metric-note">${n(b.multi_device)} multi-LOB invoices in CY versus ${n(a.multi_device)} in LY. CY rate is ${b.multi_lob_rate.toFixed(1)}% of core-device invoices.</div>
<div class="tablewrap"><table><thead><tr><th>Top CY combination</th><th>Invoices</th><th>Share of multi-LOB</th></tr></thead><tbody>
${Object.entries(b.combo_counts||{}).slice(0,5).map(([name,count])=>`<tr><td>${name}</td><td>${n(count)}</td><td>${b.multi_device?(count/b.multi_device*100).toFixed(1):'0.0'}%</td></tr>`).join('')}
</tbody></table></div>
<div class="insight" style="margin-top:12px"><b>Read</b><span>${combos[0]?.[0]||'No combination'} is the largest multi-device combination${combos[1]?`, followed by ${combos[1][0]}`:''}. This page treats basket depth as a specific cross-LOB behavior rather than a generic attach metric.</span></div>
</div>
</div>

<div class="grid2" style="margin-top:14px">
<div class="card"><h3>Top 5 Apple Accessory categories</h3><div class="metric-note">Ranked by CY comparable-period revenue.</div>
<div class="tablewrap"><table><thead><tr><th>Category</th><th>LY</th><th>CY</th><th>YoY</th></tr></thead><tbody>
${D.appleAccessoryLob.slice(0,5).map(x=>`<tr><td>${x.name}</td><td>${cr(x.ly)}</td><td>${cr(x.cy)}</td><td class='${cls(x.growth_pct)}'>${pct(x.growth_pct)}</td></tr>`).join('')}
</tbody></table></div></div>

<div class="card"><h3>Top 5 3P Accessory categories</h3><div class="metric-note">Ranked by CY comparable-period revenue.</div>
<div class="tablewrap"><table><thead><tr><th>Category</th><th>LY</th><th>CY</th><th>YoY</th></tr></thead><tbody>
${D.thirdPartyAccessoryLob.slice(0,5).map(x=>`<tr><td>${x.name}</td><td>${cr(x.ly)}</td><td>${cr(x.cy)}</td><td class='${cls(x.growth_pct)}'>${pct(x.growth_pct)}</td></tr>`).join('')}
</tbody></table></div></div>
</div>

<div class="grid2" style="margin-top:14px">
<div class="card"><h3>Leadership read</h3>
<div class="insight"><b>ASP</b><span>Core-device ASP moved from ₹${(o.core_asp25/1000).toFixed(1)}K to ₹${(o.core_asp26/1000).toFixed(1)}K, a ${pct(yoy(o.core_asp26,o.core_asp25))} YoY change. This separates price/mix movement from unit movement.</span></div>
<div class="insight"><b>Basket depth</b><span>Multi-LOB incidence moved from ${a.multi_lob_rate.toFixed(1)}% to ${b.multi_lob_rate.toFixed(1)}%. The combination mix shows where cross-category selling is happening.</span></div>
<div class="insight"><b>Accessory mix</b><span>Apple Accessory and 3P tables now show which categories are carrying value, so attachment can be read alongside actual accessory revenue quality rather than as a percentage alone.</span></div>
</div>
<div class="card"><h3>What to watch next</h3>
<div class="insight"><b>1. Attach + value together</b><span>A higher attach rate is strongest when accessory revenue per device bill also holds or improves.</span></div>
<div class="insight"><b>2. ASP vs units</b><span>Track whether ASP improvement is compensating for unit pressure in specific core LOBs.</span></div>
<div class="insight"><b>3. Multi-LOB opportunity</b><span>Use the leading combinations as selling plays: iPhone→Watch, iPhone→AirPods, Mac→AirPods and iPad→Watch.</span></div>
</div>
</div>

<div class="card" style="margin-top:14px"><h3>How these metrics are calculated</h3>
<div class="callout"><b>GP Rate</b> = total GP ÷ total taxable sales. &nbsp; <b>Discount Rate</b> = total discount ÷ total MRP. &nbsp; <b>Core Device ASP</b> = total core-device revenue ÷ total core-device units. &nbsp; <b>Accessory Attach</b> = device invoices with the accessory type ÷ total device invoices. &nbsp; <b>Multi-LOB Rate</b> = invoices carrying more than one core device LOB ÷ core-device invoices.</div></div>
</section>`}function method(){return `<section class="section active"><div class="grid2"><div class="card methodbox"><h3>Comparison logic</h3><b>Actual comparable period:</b> 27 Sep–2 Oct 2026 versus 28 Sep–3 Oct 2025 — 6 aligned OND calendar days.<br><b>Retail scope:</b> Warehouse, SMB and Hyd-HO non-retail activity are excluded from every displayed retail calculation and view.<br><b>OND’26 retail base:</b> available retail seasonal source base through 27 Dec 2025.<br><b>Primary OND’27 exit:</b> retail OND’26 seasonal base × current retail 6-day LFL YoY factor.<br><b>Secondary exit:</b> OND’27 actual / 6 elapsed days × 91 calendar days.<br><br>The prior source has no rows for 29 Sep 2025, so that aligned calendar day is retained as zero activity. Aptronix Felix Plaza is outside the approved 76-store scope. Twenty-eight prior-base Khammam accessory rows with UPC-sized values in both MRP and discount are quarantined from those two quality fields; signed revenue remains intact. Sale returns remain included with signed values.</div><div class="card methodbox"><h3>Metric logic</h3><b>LFL Revenue:</b> actual ₹ revenue for the 6 aligned calendar-day positions<br><b>OND Exit Revenue:</b> projected quarter exit, not actual revenue<br><b>Core LOB Growth Drivers:</b> unit movement for Mac, iPad, iPhone, Watch, AirPods<br><b>Accessory Growth Drivers:</b> ₹Cr value movement for Apple Accessories and 3P Accessories<br><b>Projected LOB Units:</b> LY available seasonal units × current LFL unit growth factor<br><b>GP%:</b> Σ GP AT Amount / Σ Taxable Amount<br><b>Discount%:</b> Σ valid MRP Discount / Σ valid MRP<br><b>AirPods:iPhone:</b> AirPods units / iPhone units<br><b>Mac:iPad:</b> Mac units / iPad units</div></div><div class="foot">Source: ${D.meta.source}. Retail business intelligence.</div></section>`}
function showTip(e,t){let el=document.getElementById('chartTip');if(!el)return;el.textContent=t;el.style.display='block';el.style.left=(e.clientX+12)+'px';el.style.top=(e.clientY+12)+'px'}
function hideTip(){let el=document.getElementById('chartTip');if(el)el.style.display='none'}
function dailyChart(){let el=document.getElementById('dailyChart');if(!el)return;let w=el.clientWidth||700,h=300,p=38,arr=D.daily,max=Math.max(...arr.flatMap(x=>[x.rev25,x.rev26]),1),X=i=>p+i*(w-2*p)/(Math.max(arr.length-1,1)),Y=v=>h-p-v/max*(h-2*p),pts=key=>arr.map((x,i)=>`${X(i)},${Y(x[key])}`).join(' '),lab=v=>`₹${(v/1e7).toFixed(2)} Cr`;let strategic=key=>{let vals=arr.map(x=>x[key]),hi=vals.indexOf(Math.max(...vals)),lo=vals.indexOf(Math.min(...vals));return [...new Set([0,hi,lo,arr.length-1])]},marks=(key,fill,dy)=>strategic(key).map(i=>`<g><circle cx="${X(i)}" cy="${Y(arr[i][key])}" r="4" fill="${fill}"/><text x="${X(i)}" y="${Y(arr[i][key])+dy}" font-size="9.5" font-weight="700" text-anchor="middle" fill="${fill}">${lab(arr[i][key])}</text></g>`).join(''),hover=key=>arr.map((x,i)=>{let title=`${x.date||''} • ${key==='rev25'?'OND’26':'OND’27'} • ${lab(x[key])}`.replace(/'/g,"\'");return `<circle cx="${X(i)}" cy="${Y(x[key])}" r="10" fill="rgba(0,0,0,0.001)" style="cursor:pointer" onmousemove="showTip(event,'${title}')" onmouseleave="hideTip()"/>`}).join('');el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#d8d3ca"/><polyline fill="none" stroke="#9b9387" stroke-width="2" points="${pts('rev25')}"/><polyline fill="none" stroke="#2d2b28" stroke-width="3" points="${pts('rev26')}"/>${marks('rev25','#8a8277',-9)}${marks('rev26','#2d2b28',14)}${hover('rev25')}${hover('rev26')}<text x="${p}" y="15" font-size="11" fill="#777">OND’26 comparable</text><text x="${p+135}" y="15" font-size="11" fill="#222">OND’27 actual</text></svg>`}
function render(){let f={exec,growth,lob,store,quality,method}[current];document.getElementById('app').innerHTML=f();setTimeout(dailyChart,0)}nav();render();
</script><script src="./ui-refresh.js"></script><script src="./governance.js?v=20261003-1"></script></body></html>
